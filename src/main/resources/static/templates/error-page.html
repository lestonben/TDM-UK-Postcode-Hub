<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied - UK Postcode Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

<!-- Upper Panel / Top Navbar -->
<header class="navbar">
  <div class="nav-left">
    <div class="logo">📍</div>
    <h1>UK Postcode Hub</h1>
  </div>
  <div class="nav-right">
    <span class="user-profile">Welcome, User</span>
    <button id="logoutBtn" class="logout-btn">Log Out</button>
  </div>
</header>

<div class="dashboard-container">
  <!-- Sidebar Navigation -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button id="sidebarToggle" class="toggle-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16ZM216,184H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"></path></svg>
      </button>
    </div>

    <a href="/tdm/dashboard/main" class="sidebar-item">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256"><path d="M224,115.55V208a16,16,0,0,1-16,16H160a16,16,0,0,1-16-16V160H112v48a16,16,0,0,1-16,16H48a16,16,0,0,1-16-16V115.55a16,16,0,0,1,5.17-11.78l80-72.73a16,16,0,0,1,21.66,0l80,72.73A16,16,0,0,1,224,115.55Z"></path></svg>
      <span class="sidebar-text">Route Search</span>
    </a>

    <a href="/tdm/dashboard/update" class="sidebar-item">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256"><path d="M224,128a96,96,0,0,1-157.12,74.09l-22.6,22.6A8,8,0,0,1,31,219.31l40-40a8,8,0,0,1,11.31,0l40,40a8,8,0,0,1-11.31,11.32L92.1,211.9A80,80,0,1,0,48,128a8,8,0,0,1-16,0,96,96,0,0,1,192,0Z"></path></svg>
      <span class="sidebar-text">Search/Update</span>
    </a>

    <a href="/tdm/dashboard/role-management" class="sidebar-item">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256"><path d="M230.92,212c-15.23-26.33-38.7-45.21-66.09-54.16a72,72,0,1,0-73.66,0C63.78,166.78,40.31,185.66,25.08,212a8,8,0,1,0,13.85,8c18.84-32.56,52.14-52,89.07-52s70.23,19.44,89.07,52a8,8,0,1,0,13.85-8ZM72,96a56,56,0,1,1,56,56A56.06,56.06,0,0,1,72,96Z"></path></svg>
      <span class="sidebar-text">Role Management</span>
    </a>
  </aside>

  <!-- Middle Content Area with Access Denied Card -->
  <main class="main-content" id="main-content-area">
    <div class="container-fluid">
      <div class="row justify-content-center mt-5">
        <div class="col-md-8 col-lg-6">
          <div class="card shadow-sm border-0 text-center p-4">
            <div class="card-body">
              <div class="text-danger mb-3">
                <i class="fa-solid fa-triangle-exclamation fa-3x"></i>
              </div>
              <h3 class="card-title fw-bold text-dark">Access Denied</h3>
              <p class="text-muted mt-2" th:text="${errorMessage} ?: 'You do not have the required permissions to view this page.'">
                You do not have the required permissions to view this page.
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/js/error-page.js"></script>
</body>
</html>
